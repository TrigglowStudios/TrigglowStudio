<!doctype html>
<html class="embedded">
<head>

  <title>Install in OBS</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body class="embedded">

  <script src="i18n.js"></script>
  <script src="embed.js"></script>

</html>
